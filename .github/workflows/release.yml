name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  acceptance:
    name: Acceptance Tests (preview1)
    runs-on: self-hosted
    environment: preview1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          OPUSDNS_API_KEY: ${{ secrets.OPUSDNS_API_KEY }}
          OPUSDNS_API_ENDPOINT: ${{ secrets.OPUSDNS_API_ENDPOINT }}
        run: |
          go test ./internal/provider/ -v -count=1 -parallel=4 -timeout 30m

  release:
    name: GoReleaser
    needs: acceptance
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
