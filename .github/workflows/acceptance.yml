name: Acceptance Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Acceptance Tests (preview1)
    runs-on: self-hosted
    environment: preview1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          OPUSDNS_API_KEY: ${{ secrets.OPUSDNS_API_KEY }}
          OPUSDNS_API_ENDPOINT: ${{ secrets.OPUSDNS_API_ENDPOINT }}
        run: |
          go test ./internal/provider/ -v -count=1 -parallel=4 -timeout 30m
