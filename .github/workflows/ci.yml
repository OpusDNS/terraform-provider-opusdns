name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (lint, vet, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1 -timeout 120s

  terraform:
    name: Terraform (fmt examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform fmt -check (recursive)
        # Examples use `source = "opusdns/opusdns"` which is not yet
        # published to the registry, so `terraform init`/`validate` is
        # not run in CI. Once the provider is published, add a
        # `terraform init -backend=false && terraform validate` step
        # per example directory.
        run: terraform fmt -check -recursive -diff examples/
