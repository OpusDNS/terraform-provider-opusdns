# golangci-lint configuration for terraform-provider-opusdns.
# Conservative defaults that match the rest of the terraform-plugin-framework
# provider ecosystem. Bump as we adopt stricter rules.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      # NOMINET is the legal name of the .uk registry; not a misspelling of "nominate".
      ignore-rules:
        - nominet

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
